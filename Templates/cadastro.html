<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Casa de Ração - Estoque</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cadastro.html">Cadastrar Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="listagem.html">Listar Produtos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Cadastro de Novo Produto</h4>
                    </div>
                    <div class="card-body">
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="nomeProduto" class="form-label">Nome do Produto</label>
                                <input type="text" class="form-control" id="nomeProduto" placeholder="Ex: Ração Golden 15kg" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoriaProduto" class="form-label">Categoria</label>
                                <select class="form-select" id="categoriaProduto" required>
                                    <option value="">Selecione uma categoria...</option>
                                    <option value="racao_caes">Ração para Cães</option>
                                    <option value="racao_gatos">Ração para Gatos</option>
                                    <option value="acessorios">Acessórios</option>
                                    <option value="medicamentos">Medicamentos</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="quantidadeProduto" class="form-label">Quantidade Inicial</label>
                                    <input type="number" class="form-control" id="quantidadeProduto" placeholder="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="precoProduto" class="form-label">Preço (R$)</label>
                                    <input type="number" step="0.01" class="form-control" id="precoProduto" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Salvar Produto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
