<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Casa de Ração - Estoque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cadastro/">Cadastrar Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listagem/">Listar Produtos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/categorias/">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fornecedores/">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimentacao/">Movimentação</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Categorias Cadastradas</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCategoria">+ Nova Categoria</button>
        </div>
        
        <div class="table-responsive bg-white shadow-sm rounded p-3">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome da Categoria</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-categorias">
                    <!-- Tabela pronta para receber os dados do backend via JS -->
                    <tr>
                        <td colspan="4" class="text-center">Carregando categorias...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Adicionar Nova Categoria (Para manter a criação simples como discutimos) -->
    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCategoriaLabel">Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="formNovaCategoria">
                        <div class="mb-3">
                            <label for="nomeNovaCategoria" class="form-label">Nome da Categoria</label>
                            <input type="text" class="form-control" id="nomeNovaCategoria" placeholder="Ex: Acessórios" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricaoCategoria" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricaoCategoria" rows="2" placeholder="Breve descrição da categoria..." required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary">Salvar Categoria</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script reservado para a lógica de categorias que o Vinicius vai criar -->
    <script src="/static/products/js/categorias.js"></script>
</body>
</html>
