<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Casa de Ração - Estoque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cadastro/">Cadastrar Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listagem/">Listar Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias/">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fornecedores/">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/movimentacao/">Movimentação</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">Registrar Movimentação de Estoque</h4>
                    </div>
                    <div class="card-body">
                        <form id="formMovimentacao">
                            <div class="mb-3">
                                <label for="tipoMovimentacao" class="form-label">Tipo de Movimentação</label>
                                <select class="form-select" id="tipoMovimentacao" required>
                                    <option value="entrada">Entrada (Adicionar ao estoque)</option>
                                    <option value="saida">Saída (Venda ou Baixa)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="produtoSelecionado" class="form-label">Produto</label>
                                <select class="form-select" id="produtoSelecionado" required>
                                    <option value="">Selecione o produto...</option>
                                    </select>
                            </div>
                            <div class="mb-3">
                                <label for="quantidadeMovimentacao" class="form-label">Quantidade</label>
                                <input type="number" class="form-control" id="quantidadeMovimentacao" placeholder="Ex: 5" required>
                            </div>
                            <div class="d-grid">
                                <button type="button" id="btnConfirmar" class="btn btn-dark">Confirmar Movimentação</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/products/js/movimentacao.js"></script>
</body>
</html>
