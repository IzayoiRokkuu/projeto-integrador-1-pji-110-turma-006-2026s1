<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Casa de Ração - Estoque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cadastro/">Cadastrar Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="/listagem/">Listar Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias/">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/fornecedores/">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimentacao/">Movimentação</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Fornecedores</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFornecedor">+ Novo Fornecedor</button>
        </div>
        
        <div class="table-responsive bg-white shadow-sm rounded p-3">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Empresa</th>
                        <th scope="col">CNPJ</th>
                        <th scope="col">Contato / Telefone</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-fornecedores">
                    <tr>
                        <td colspan="4" class="text-center">Carregando fornecedores...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalFornecedor" tabindex="-1" aria-labelledby="modalFornecedorLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalFornecedorLabel">Novo Fornecedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="formNovoFornecedor">
                        <div class="mb-3">
                            <label for="nomeFornecedor" class="form-label">Nome da Empresa *</label>
                            <input type="text" class="form-control" id="nomeFornecedor" placeholder="Ex: Distribuidora Pet Feliz" required>
                        </div>
                        <div class="mb-3">
                            <label for="cnpjFornecedor" class="form-label">CNPJ</label>
                            <input type="text" class="form-control" id="cnpjFornecedor" placeholder="00.000.000/0001-00">
                        </div>
                        <div class="mb-3">
                            <label for="telefoneFornecedor" class="form-label">Contato / Telefone</label>
                            <input type="text" class="form-control" id="telefoneFornecedor" placeholder="(11) 99999-9999">
                        </div>
                        <div class="mb-3">
                            <label for="emailFornecedor" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="emailFornecedor" placeholder="contato@empresa.com">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarFornecedor">Salvar Fornecedor</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarFornecedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Editar Fornecedor</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarFornecedor">
                        <div class="mb-3">
                            <label class="form-label">Nome da Empresa</label>
                            <input type="text" class="form-control" id="editNomeFornecedor">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CNPJ</label>
                            <input type="text" class="form-control" id="editCnpjFornecedor">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contato / Telefone</label>
                                <input type="text" class="form-control" id="editContatoFornecedor">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="editEmailFornecedor">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/products/js/fornecedores.js"></script>
</body>
</html>
