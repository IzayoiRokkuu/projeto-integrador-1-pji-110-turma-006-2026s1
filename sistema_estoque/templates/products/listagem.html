<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Produtos - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Casa de Ração - Estoque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cadastro/">Cadastrar Produto</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/listagem/">Listar Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias/">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fornecedores/">Fornecedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimentacao/">Movimentação</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Produtos em Estoque</h2>
        
        <div class="table-responsive bg-white shadow-sm rounded p-3">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome do Produto</th>
                        <th scope="col">Categoria</th>
                        <th scope="col">Quantidade</th>
                        <th scope="col">Preço (R$)</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <tr>
                        <td colspan="6" class="text-center">Carregando produtos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalEditarProduto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Editar Produto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarProduto">
                        <div class="mb-3">
                            <label class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="editNomeProduto">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select class="form-select" id="editCategoriaProduto"></select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quantidade</label>
                                <input type="number" class="form-control" id="editQuantidadeProduto">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="editPrecoProduto">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/products/js/listagem.js"></script>
</body>
</html>
